services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      SUPPORTLENS_QDRANT_URL: http://qdrant:6333
      SUPPORTLENS_CORPUS_DIR: /app/data/snapshot
      SUPPORTLENS_ENABLE_RERANKER: "false"
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  qdrant_data:
